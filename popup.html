<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 220px;
      padding: 12px;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px 0;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    label {
      font-size: 13px;
    }
    #intensityValue {
      font-size: 12px;
      color: #555;
    }
    #reloadNote {
      font-size: 11px;
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Boldly</h1>

  <div class="row">
    <label for="enabledToggle">Enabled</label>
    <input type="checkbox" id="enabledToggle" />
  </div>

  <div class="row" style="flex-direction: column; align-items: stretch;">
    <label for="intensitySlider">
      Bold intensity: <span id="intensityValue">50%</span>
    </label>
    <input type="range" id="intensitySlider" min="20" max="70" step="5" />
  </div>

  <div id="reloadNote">Reload the page for changes to apply.</div>

  <script src="popup.js"></script>
</body>
</html>
